# =============================================================================
# Elite Brand Engine — configuration
# -----------------------------------------------------------------------------
# Non-secret settings live here. SECRETS (API keys, SMTP passwords) NEVER go in
# this file — set them as environment variables / GitHub Actions secrets.
# Copy to config.local.yml to override locally without touching this file.
# =============================================================================

currency: USD

site:
  title: "Elite Brand Engine"
  tagline: "Radar de ofertas para equipo de montañismo y alpinismo"

# --- How a price becomes a "deal" -------------------------------------------
detection:
  min_discount_pct: 15.0        # objective band is 15%–60% below regular price
  suspect_discount_pct: 68.0    # above this = SUSPECT (likely mismatch/price error)
  baseline_percentile: 85.0     # "regular price" = this percentile of recent prices
  baseline_window_days: 120
  min_history_points: 4         # observations needed before statistical baselining
  require_in_stock: true        # ignore out-of-stock offers
  include_used: false           # used ≠ "the same article new" (default off)
  include_refurbished: true     # outlet/refurb count (small score penalty)
  max_offer_age_days: 3         # ignore stale offers for alerting
  alert_ttl_days: 7             # don't re-email the same deal within N days
  min_match_score: 0.6          # confidence a listing is the right product
  suspect_min_match_score: 0.9  # higher bar to trust an unusually large discount
  category_min_discount: {}     # e.g. {"Hardshell": 12} for rarely-discounted lines

# --- Regional search scope --------------------------------------------------
# standard = US only. expanded = US + Canada + Europe: European brands (Peak
# Performance, Helly Hansen, Norrøna, Rab, Mammut, Scarpa…) and Arc'teryx
# (Canada) are often cheapest in their home market. International shipping is
# the buyer's known cost and is NOT penalised or hidden.
search:
  scope: standard               # standard | expanded

# --- Seasonality: prioritise counter-seasonal buys --------------------------
# In summer, winter gear (down/hardshell/mountaineering) hits end-of-season
# clearance — and vice-versa. Off-season deals are surfaced earlier and ranked
# higher. Product season is inferred from category, or set `season` on an item.
seasonality:
  hemisphere: north             # north | south (US = north)
  offseason_boost: 12.0         # extra ranking score for off-season buys
  offseason_discount_relax: 3.0 # lower the threshold a bit off-season

# --- Currency normalisation (all prices compared in `base`) -----------------
fx:
  base: USD
  rates:                        # value of 1 unit in USD; update as needed
    USD: 1.0
    EUR: 1.08
    GBP: 1.27
    CAD: 0.73
    ARS: 0.0011

# --- Where prices come from --------------------------------------------------
# Only LEGITIMATE sources: official APIs + affiliate datafeeds + polite,
# robots.txt-respecting fetching. The 'sample' source ships enabled so the whole
# system works with zero setup; turn on the real ones as you get credentials.
sources:
  sample:
    enabled: true            # synthetic demo data (no network, no keys)

  ebay:
    enabled: false           # needs EBAY_CLIENT_ID / EBAY_CLIENT_SECRET
    marketplace: EBAY_US
    limit: 8

  amazon:
    enabled: false           # needs AMAZON_ACCESS_KEY / _SECRET_KEY / _PARTNER_TAG
    marketplace: www.amazon.com
    region: us-east-1
    search_index: SportingGoods

  affiliate_feed:
    enabled: false           # REI / Backcountry / Patagonia / brand DTC via feeds
    feeds: []
    # Example (uncomment and fill in once you're an approved affiliate):
    # feeds:
    #   - source: "REI Co-op"
    #     url: "https://datafeed.avantlink.com/download.php?...format=csv"
    #     format: csv
    #     mapping:
    #       name: "Product Name"
    #       brand: "Brand"
    #       price: "Sale Price"
    #       list_price: "Retail Price"
    #       url: "Buy URL"
    #       image: "Image URL"
    #       size: "Size"
    #       color: "Color"
    #       upc: "UPC"

# --- Email alerts ------------------------------------------------------------
# Transport auto-detected from env (SMTP_* / SENDGRID_API_KEY / RESEND_API_KEY).
# With no transport or no recipients it runs in DRY-RUN and renders the email to
# dist/last_email.html instead of sending.
email:
  enabled: true
  subject_prefix: "[Elite Brand Engine] "
  from_name: "Elite Brand Engine"
  to: []                     # e.g. ["compras@tuempresa.com"] or set ALERT_EMAIL_TO
